[project]
name = "artist-news-bot"
version = "0.1.0"
description = "Artist news collector -> AI review -> ntfy approval -> X post"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=1.11",
    "requests>=2.32",
    "requests-oauthlib>=2.0",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
newsbot = "newsbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
